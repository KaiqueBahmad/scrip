[supervisord]
nodaemon=true
user=root

; Master stays root (needed to bind and manage worker processes); nginx's own
; config drops its workers to www-data, same as the stock Debian package.
[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Runs as the unprivileged `scrip` user; `directory` is its cwd, since scrip.config.json
; and databasePath are both resolved relative to process.cwd() at startup.
[program:backend]
command=node dist/main.js
directory=/app/backend
user=scrip
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
