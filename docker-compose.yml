services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - "8081:8081"
    environment:
      SCRIP_HOST: 0.0.0.0
      SCRIP_PORT: 8081
      SCRIP_DATABASE_PATH: data/scrip.sqlite
      SCRIP_JWT_SIGNING_SECRET: change-me
    volumes:
      - scrip-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_BASE_URL: http://localhost:8081
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  scrip-data:
